<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>GOLIBAAZ</title>
    <meta name="description" content="A top-down action roguelike: dodge-roll through bullet patterns, clear rooms, beat three bosses." />
    <meta name="theme-color" content="#08070a" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GOLIBAAZ" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2317120f'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f3e6c8' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23d8452f'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html, body {
        margin: 0; height: 100%; background: #08070a; overflow: hidden;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      }
      body { position: fixed; inset: 0; }
      /* Fixed to the visible viewport (follows mobile toolbars) and kept clear of notches.
         The insets are 0 on desktop, so this is the same as the old 100vw x 100vh. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      canvas { display: block; touch-action: none; }
      /* Privy sign-in modal: allow typing and selecting inside it */
      #privy-dialog, #privy-dialog *, [data-privy-dialog], input, textarea { -webkit-user-select: text; user-select: text; touch-action: auto; }

      #rotate {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        padding: env(safe-area-inset-top, 0px) 32px env(safe-area-inset-bottom, 0px);
        background: radial-gradient(ellipse at 50% 38%, #2a1d14 0%, #120e0b 55%, #08070a 100%);
        color: #f3e6c8; font-family: Oswald, 'Arial Narrow', sans-serif; text-align: center;
      }
      #rotate[hidden] { display: none; }
      #rotate .phone {
        width: 64px; height: 108px; border: 4px solid #f3e6c8; border-radius: 12px; position: relative;
        animation: golibaaz-turn 2.4s ease-in-out infinite;
      }
      #rotate .phone::after {
        content: ''; position: absolute; left: 50%; bottom: 8px; width: 10px; height: 10px; margin-left: -5px;
        border-radius: 50%; background: #d8452f;
      }
      #rotate h1 { margin: 10px 0 0; font-weight: 700; font-size: 30px; letter-spacing: 4px; }
      #rotate .bar { width: 120px; height: 3px; background: #d8452f; }
      #rotate p { margin: 0; font-weight: 400; font-size: 17px; letter-spacing: 1px; color: #a3978a; max-width: 280px; line-height: 1.4; }
      @keyframes golibaaz-turn {
        0%, 25% { transform: rotate(0deg); }
        55%, 80% { transform: rotate(-90deg); }
        100% { transform: rotate(0deg); }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" hidden>
      <div class="phone"></div>
      <h1>TURN YOUR PHONE</h1>
      <div class="bar"></div>
      <p>GOLIBAAZ plays sideways. Rotate to landscape to continue.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
